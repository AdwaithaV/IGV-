# nav2_params.yaml
# Nav2 params: SMAC Hybrid-A* global planner + Regulated Pure Pursuit controller
# --- GENERAL ---
use_sim_time: false

# Frames & topics (REPLACE with your robot's actual frames/topics)
global_frame: "map"
robot_base_frame: "base_link"
odom_topic: "/odom"
scan_topic: "/scan"

# --- PLANNER SERVER (SMAC Hybrid A*) ---
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["SmacPlannerHybrid"]

    # Smac Hybrid plugin instance (ID must match the name in planner_plugins)
    SmacPlannerHybrid:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      # Kinematic / search tuning (adjust to robot)
      use_reeds_shepp: false          # true if using Reeds-Shepp model for reversing
      allow_unknown: false
      use_grid_path: false
      downsample_costmap: false
      downsampling_factor: 1
      search_time: 0.5                # seconds budget for search (increase for hard maps)
      minimum_turning_radius: 0.20    # meters (set to vehicle minimum turning radius)
      # grid and primitives (affect precision and speed)
      motion_primitives_per_cell: 4
      grid_resolution: 0.05
      # path smoothing / post-processing (SMAC built-in smoothing)
      do_smoothing: true

# --- CONTROLLER SERVER (Regulated Pure Pursuit) ---
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    controller_plugins: ["RegulatedPurePursuit"]

    RegulatedPurePursuit:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Kinematic / velocity limits (SET to your robot's capabilities)
      desired_linear_vel: 0.45         # base target linear velocity (m/s)
      base_desired_linear_vel: 0.45
      min_linear_vel: 0.05
      max_linear_vel: 0.7              # max forward speed Nav2 will request (m/s)
      max_angular_vel: 1.0             # rad/s (rotation command limit)
      rotate_to_heading_angular_vel: 0.7

      # Lookahead configuration
      lookahead_dist: 0.8              # static lookahead (m) used when velocity-scaling disabled
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.0              # lookahead = |v| * lookahead_time
      min_lookahead_dist: 0.25
      max_lookahead_dist: 2.0

      # Approach & regulation (slowing down for turns/goals/obstacles)
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.06

      # Collision projection & safety
      max_allowed_time_to_collision_up_to_carrot: 0.7  # seconds ahead to simulate for collision check
      min_distance_to_obstacle: 0.10                   # minimum allowed clearance (m)

      # Controller bookkeeping
      use_rotational_alignment: true
      allow_reversing: true            # set true if planner returns reversing maneuvers (REED_SHEPP / Hybrid with reversing)

# --- GLOBAL COSTMAP ---
global_costmap:
  ros__parameters:
    global_frame: "map"
    robot_base_frame: "base_link"
    update_frequency: 2.0
    publish_frequency: 1.0
    static_map: true
    plugins: ["static_layer","obstacle_layer","inflation_layer"]

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_topic: "/map"
      subscribe_to_updates: true

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: "laser"
      laser:
        sensor_frame: "laser_frame"    # REPLACE with actual laser frame
        data_type: "LaserScan"
        topic: "/scan"
        expected_update_rate: 20.0
        observation_persistent: false
        clearing: true

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.25

# --- LOCAL COSTMAP (rolling window) ---
local_costmap:
  ros__parameters:
    global_frame: "odom"
    robot_base_frame: "base_link"
    update_frequency: 10.0
    publish_frequency: 5.0
    rolling_window: true
    width: 6.0
    height: 6.0
    resolution: 0.05
    plugins: ["obstacle_layer","inflation_layer"]

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: "laser"
      laser:
        sensor_frame: "laser_frame"    # REPLACE with actual laser frame
        data_type: "LaserScan"
        topic: "/scan"
        expected_update_rate: 20.0
        observation_persistent: false
        clearing: true

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.25

# --- RECOVERIES ---
recoveries_server:
  ros__parameters:
    recovery_behaviors: ["spin_recovery", "back_up"]
    spin_recovery:
      plugin: "nav2_recoveries::Spin"
    back_up:
      plugin: "nav2_recoveries::BackUp"

# --- BT Navigator & lifecycle manager ---
bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: "behavior_trees/navigate_w_replanning_time.xml"

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server","planner_server","controller_server","bt_navigator","recoveries_server"]

# --- TUNING / NOTES (do not remove) ---
# - If SMAC Hybrid plans too close to obstacles, increase inflation_radius or set
#   SmacPlannerHybrid planning clearance parameters (see SMAC docs).
# - If Pure Pursuit skips important path maneuvers, reduce lookahead_time or
#   max_lookahead_dist; for very tight spaces reduce max_linear_vel and lookahead distances.
# - For reversing maneuvers, ensure planner uses REEDS_SHEPP/allow_reversing and controller allow_reversing=true.